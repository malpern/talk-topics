<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0a0612"/>
  <!-- CRT Monitor -->
  <rect x="220" y="60" width="360" height="280" rx="20" fill="#1a1530" stroke="#3a3050" stroke-width="3"/>
  <rect x="240" y="80" width="320" height="220" rx="8" fill="#0a1a0a"/>
  <!-- Green phosphor text on CRT -->
  <text x="260" y="115" font-family="'JetBrains Mono',monospace" font-size="14" fill="#33ff33" opacity="0.9">$ hammerspoon</text>
  <text x="260" y="140" font-family="'JetBrains Mono',monospace" font-size="14" fill="#33ff33" opacity="0.7">Loading config...</text>
  <text x="260" y="165" font-family="'JetBrains Mono',monospace" font-size="14" fill="#33ff33" opacity="0.7">✓ dia-move-tab</text>
  <text x="260" y="190" font-family="'JetBrains Mono',monospace" font-size="14" fill="#33ff33" opacity="0.7">✓ dia-url-router</text>
  <text x="260" y="215" font-family="'JetBrains Mono',monospace" font-size="14" fill="#33ff33" opacity="0.5">Ready.</text>
  <rect x="260" y="225" width="10" height="16" fill="#33ff33" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Scanlines -->
  <g opacity="0.06">
    <line x1="240" y1="82" x2="560" y2="82" stroke="#33ff33" stroke-width="1"/><line x1="240" y1="86" x2="560" y2="86" stroke="#33ff33" stroke-width="1"/>
    <line x1="240" y1="90" x2="560" y2="90" stroke="#33ff33" stroke-width="1"/><line x1="240" y1="94" x2="560" y2="94" stroke="#33ff33" stroke-width="1"/>
    <line x1="240" y1="98" x2="560" y2="98" stroke="#33ff33" stroke-width="1"/>
  </g>
  <!-- Monitor stand -->
  <rect x="350" y="340" width="100" height="15" rx="4" fill="#2a2040"/>
  <rect x="330" y="355" width="140" height="8" rx="3" fill="#3a3050"/>
  <!-- Keyboard -->
  <rect x="200" y="385" width="400" height="60" rx="8" fill="#1a1530" stroke="#3a3050" stroke-width="2"/>
  <g fill="#2a2040">
    <rect x="220" y="395" width="24" height="16" rx="3"/><rect x="250" y="395" width="24" height="16" rx="3"/>
    <rect x="280" y="395" width="24" height="16" rx="3"/><rect x="310" y="395" width="24" height="16" rx="3"/>
    <rect x="340" y="395" width="24" height="16" rx="3"/><rect x="370" y="395" width="24" height="16" rx="3"/>
    <rect x="400" y="395" width="24" height="16" rx="3"/><rect x="430" y="395" width="24" height="16" rx="3"/>
    <rect x="460" y="395" width="24" height="16" rx="3"/><rect x="490" y="395" width="24" height="16" rx="3"/>
    <rect x="520" y="395" width="24" height="16" rx="3"/><rect x="550" y="395" width="24" height="16" rx="3"/>
    <rect x="230" y="418" width="24" height="16" rx="3"/><rect x="260" y="418" width="24" height="16" rx="3"/>
    <rect x="290" y="418" width="120" height="16" rx="3"/>
    <rect x="420" y="418" width="24" height="16" rx="3"/><rect x="450" y="418" width="24" height="16" rx="3"/>
    <rect x="480" y="418" width="24" height="16" rx="3"/><rect x="510" y="418" width="24" height="16" rx="3"/>
  </g>
  <!-- Modem -->
  <rect x="640" y="200" width="120" height="50" rx="6" fill="#1a1530" stroke="#3a3050" stroke-width="2"/>
  <circle cx="660" cy="225" r="4" fill="#33ff33" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="675" cy="225" r="4" fill="#ff3ba5" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="690" cy="225" r="4" fill="#ffd93c" opacity="0.5"/>
  <text x="710" y="230" font-family="'JetBrains Mono',monospace" font-size="9" fill="#6a6280">2400</text>
  <!-- Cable from modem to monitor -->
  <path d="M640,225 Q610,225 590,280 Q580,310 560,300" fill="none" stroke="#3a3050" stroke-width="2"/>
  <!-- Neon ambient glow from screen -->
  <ellipse cx="400" cy="180" rx="200" ry="120" fill="#33ff33" opacity="0.02"/>
</svg>
