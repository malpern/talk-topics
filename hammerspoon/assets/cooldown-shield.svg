<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0a0612"/>
  <!-- Left window -->
  <rect x="60" y="120" width="200" height="160" rx="12" fill="none" stroke="#24d4ff" stroke-width="2" opacity="0.7"/>
  <circle cx="82" cy="138" r="4" fill="#24d4ff" opacity="0.5"/>
  <circle cx="96" cy="138" r="4" fill="#24d4ff" opacity="0.5"/>
  <line x1="60" y1="148" x2="260" y2="148" stroke="#24d4ff" stroke-width="1" opacity="0.3"/>
  <!-- Right window with shield -->
  <rect x="540" y="120" width="200" height="160" rx="12" fill="none" stroke="#ff8a3c" stroke-width="2" opacity="0.7"/>
  <circle cx="562" cy="138" r="4" fill="#ff8a3c" opacity="0.5"/>
  <circle cx="576" cy="138" r="4" fill="#ff8a3c" opacity="0.5"/>
  <line x1="540" y1="148" x2="740" y2="148" stroke="#ff8a3c" stroke-width="1" opacity="0.3"/>
  <!-- Tab safely in right window -->
  <rect x="580" y="165" width="120" height="30" rx="6" fill="#ff8a3c" opacity="0.3"/>
  <polygon points="625,172 625,190 640,181" fill="#ff8a3c" opacity="0.6"/>
  <!-- Shield / force field -->
  <ellipse cx="640" cy="200" rx="130" ry="100" fill="none" stroke="#ffd93c" stroke-width="2" opacity="0.5" stroke-dasharray="8,4"/>
  <ellipse cx="640" cy="200" rx="140" ry="110" fill="none" stroke="#ffd93c" stroke-width="1" opacity="0.2" stroke-dasharray="4,6"/>
  <!-- Blocked arrow bouncing off shield -->
  <path d="M300,200 L470,200" fill="none" stroke="#ff3ba5" stroke-width="2.5" opacity="0.6" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="185" x2="510" y2="170" stroke="#ff3ba5" stroke-width="2" opacity="0.4"/>
  <line x1="490" y1="215" x2="510" y2="230" stroke="#ff3ba5" stroke-width="2" opacity="0.4"/>
  <!-- Timer -->
  <circle cx="400" cy="380" r="30" fill="none" stroke="#ffd93c" stroke-width="2" opacity="0.6"/>
  <text x="400" y="388" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" fill="#ffd93c" opacity="0.8">10m</text>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff3ba5" opacity="0.6"/>
    </marker>
  </defs>
</svg>
