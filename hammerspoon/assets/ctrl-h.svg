<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#0a0612"/>
  <!-- Hand silhouette pressing keys -->
  <!-- Keyboard base -->
  <rect x="40" y="160" width="320" height="120" rx="12" fill="#1a1530" stroke="#2a2535" stroke-width="2"/>
  <!-- Key rows -->
  <!-- Row 1 -->
  <g fill="#0a0612" stroke="#2a2535" stroke-width="1">
    <rect x="60" y="175" width="28" height="28" rx="4"/>
    <rect x="92" y="175" width="28" height="28" rx="4"/>
    <rect x="124" y="175" width="28" height="28" rx="4"/>
    <rect x="156" y="175" width="28" height="28" rx="4"/>
    <rect x="188" y="175" width="28" height="28" rx="4"/>
    <rect x="220" y="175" width="28" height="28" rx="4"/>
    <rect x="252" y="175" width="28" height="28" rx="4"/>
    <rect x="284" y="175" width="28" height="28" rx="4"/>
    <rect x="316" y="175" width="28" height="28" rx="4"/>
  </g>
  <!-- Row 2 - H key highlighted -->
  <g fill="#0a0612" stroke="#2a2535" stroke-width="1">
    <rect x="68" y="208" width="28" height="28" rx="4"/>
    <rect x="100" y="208" width="28" height="28" rx="4"/>
    <rect x="132" y="208" width="28" height="28" rx="4"/>
    <rect x="164" y="208" width="28" height="28" rx="4"/>
    <rect x="196" y="208" width="28" height="28" rx="4"/>
  </g>
  <!-- H key - GLOWING -->
  <rect x="228" y="208" width="28" height="28" rx="4" fill="#ffd93c" opacity="0.9"/>
  <text x="242" y="228" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="14" fill="#0a0612">H</text>
  <!-- Glow around H -->
  <rect x="224" y="204" width="36" height="36" rx="6" fill="none" stroke="#ffd93c" stroke-width="1.5" opacity="0.4"/>
  <g fill="#0a0612" stroke="#2a2535" stroke-width="1">
    <rect x="260" y="208" width="28" height="28" rx="4"/>
    <rect x="292" y="208" width="28" height="28" rx="4"/>
  </g>
  <!-- Row 3 - Ctrl highlighted -->
  <!-- Ctrl key - GLOWING -->
  <rect x="60" y="241" width="50" height="28" rx="4" fill="#ff3ba5" opacity="0.9"/>
  <text x="85" y="261" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="10" fill="#0a0612">ctrl</text>
  <!-- Glow around Ctrl -->
  <rect x="56" y="237" width="58" height="36" rx="6" fill="none" stroke="#ff3ba5" stroke-width="1.5" opacity="0.4"/>
  <g fill="#0a0612" stroke="#2a2535" stroke-width="1">
    <rect x="114" y="241" width="28" height="28" rx="4"/>
    <rect x="146" y="241" width="130" height="28" rx="4"/>
    <rect x="280" y="241" width="28" height="28" rx="4"/>
    <rect x="312" y="241" width="28" height="28" rx="4"/>
  </g>
  <!-- Press indicators / sparkle -->
  <circle cx="85" cy="235" r="3" fill="#ff3ba5" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="242" cy="202" r="3" fill="#ffd93c" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <!-- Label -->
  <text x="200" y="60" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="36" letter-spacing="0.08em">
    <tspan fill="#ff3ba5">CTRL</tspan>
    <tspan fill="#555"> + </tspan>
    <tspan fill="#ffd93c">H</tspan>
  </text>
  <!-- Alert bubble -->
  <rect x="120" y="85" width="160" height="40" rx="8" fill="#1a1530" stroke="#ffd93c" stroke-width="1.5"/>
  <text x="200" y="110" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#ffd93c">Hello from Hammerspoon!</text>
  <!-- Little triangle pointer -->
  <polygon points="200,125 193,133 207,133" fill="#1a1530" stroke="#ffd93c" stroke-width="1.5"/>
</svg>
