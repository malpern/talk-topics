<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="450" fill="#0a0612"/>
  <!-- Layer 3 (bottom) — JavaScript -->
  <rect x="80" y="300" width="440" height="80" rx="12" fill="#1a1530" stroke="#ffd93c" stroke-width="2.5"/>
  <text x="300" y="335" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="28" fill="#ffd93c" letter-spacing="0.08em">JAVASCRIPT</text>
  <text x="300" y="365" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#8a8280">video.currentTime · video.paused</text>
  <!-- Layer 2 (middle) — AppleScript -->
  <rect x="80" y="190" width="440" height="80" rx="12" fill="#1a1530" stroke="#ff3ba5" stroke-width="2.5"/>
  <text x="300" y="225" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="28" fill="#ff3ba5" letter-spacing="0.08em">APPLESCRIPT</text>
  <text x="300" y="255" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#8a8280">tell application "Dia" · System Events</text>
  <!-- Layer 1 (top) — Lua / Hammerspoon -->
  <rect x="80" y="80" width="440" height="80" rx="12" fill="#1a1530" stroke="#24d4ff" stroke-width="2.5"/>
  <text x="300" y="115" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="28" fill="#24d4ff" letter-spacing="0.08em">LUA</text>
  <text x="300" y="145" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#8a8280">Hammerspoon · hotkeys · watchers · notify</text>
  <!-- Connecting lines -->
  <line x1="300" y1="160" x2="300" y2="190" stroke="#8a8280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="300" y1="270" x2="300" y2="300" stroke="#8a8280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Glow effects -->
  <ellipse cx="300" cy="120" rx="200" ry="30" fill="#24d4ff" opacity="0.03"/>
  <ellipse cx="300" cy="230" rx="200" ry="30" fill="#ff3ba5" opacity="0.03"/>
  <ellipse cx="300" cy="340" rx="200" ry="30" fill="#ffd93c" opacity="0.03"/>
  <!-- Label -->
  <text x="300" y="430" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#555" letter-spacing="0.15em">THREE LAYERS · ONE MENU-BAR DAEMON</text>
</svg>
