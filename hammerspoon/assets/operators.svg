<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="vhs">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="bnoise"/>
      <feBlend in="SourceGraphic" in2="bnoise" mode="multiply" result="blend"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Scanlines -->
  <g opacity="0.15">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#fff" stroke-width="1" repeat="225"/>
  </g>
  <!-- Phone icons -->
  <g fill="#ff3ba5" opacity="0.8">
    <text x="120" y="200" font-family="serif" font-size="60">☎</text>
    <text x="270" y="200" font-family="serif" font-size="60">☎</text>
    <text x="420" y="200" font-family="serif" font-size="60">☎</text>
    <text x="570" y="200" font-family="serif" font-size="60">☎</text>
  </g>
  <!-- Desk silhouettes -->
  <rect x="80" y="230" width="600" height="8" rx="4" fill="#2a1f4a"/>
  <!-- People silhouettes -->
  <g fill="#3a2f5a">
    <circle cx="150" cy="160" r="25"/>
    <rect x="130" y="185" width="40" height="45" rx="8"/>
    <circle cx="300" cy="160" r="25"/>
    <rect x="280" y="185" width="40" height="45" rx="8"/>
    <circle cx="450" cy="160" r="25"/>
    <rect x="430" y="185" width="40" height="45" rx="8"/>
    <circle cx="600" cy="160" r="25"/>
    <rect x="580" y="185" width="40" height="45" rx="8"/>
  </g>
  <!-- Text -->
  <text x="400" y="320" text-anchor="middle" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#ffd93c" letter-spacing="3">
    OPERATORS ARE
  </text>
  <text x="400" y="370" text-anchor="middle" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#ffd93c" letter-spacing="3">
    STANDING BY
  </text>
  <!-- Phone number -->
  <text x="400" y="420" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#ff3ba5">
    1-800-HAM-RSPN
  </text>
</svg>
