<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#0a0612"/>
  <!-- Raycast-inspired logo — stylized ray/beam -->
  <g transform="translate(100,100)">
    <rect x="-40" y="-40" width="80" height="80" rx="18" fill="#ff6363" transform="rotate(45)"/>
    <rect x="-28" y="-28" width="56" height="56" rx="12" fill="#0a0612" transform="rotate(45)"/>
    <!-- Ray beams -->
    <line x1="0" y1="-50" x2="0" y2="-70" stroke="#ff6363" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="-35" x2="50" y2="-50" stroke="#ff6363" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="0" x2="70" y2="0" stroke="#ff6363" stroke-width="4" stroke-linecap="round"/>
    <line x1="-50" y1="0" x2="-70" y2="0" stroke="#ff6363" stroke-width="4" stroke-linecap="round"/>
    <line x1="-35" y1="-35" x2="-50" y2="-50" stroke="#ff6363" stroke-width="4" stroke-linecap="round"/>
    <!-- Search cursor -->
    <rect x="-16" y="-4" width="32" height="8" rx="4" fill="#ff6363"/>
  </g>
</svg>
