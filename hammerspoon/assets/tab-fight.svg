<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="500" fill="#0a0612"/>

  <!-- Circular arrows forming the loop -->
  <!-- Top arc: auto-route (pink) — Work to Personal -->
  <path d="M350,140 A160,160 0 0,0 150,140" fill="none" stroke="#ff3ba5" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Arrow head top-left -->
  <polygon points="150,140 162,128 165,145" fill="#ff3ba5"/>
  <!-- Label top -->
  <text x="250" y="80" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#ff3ba5">auto-route</text>

  <!-- Bottom arc: Ctrl+S (gold) — Personal back to Work -->
  <path d="M150,360 A160,160 0 0,0 350,360" fill="none" stroke="#ffd93c" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Arrow head bottom-right -->
  <polygon points="350,360 338,372 335,355" fill="#ffd93c"/>
  <!-- Label bottom -->
  <text x="250" y="430" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#ffd93c">Ctrl+S</text>

  <!-- Work window (right) -->
  <g transform="translate(320,200)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="none" stroke="#ff8a3c" stroke-width="2.5"/>
    <circle cx="16" cy="14" r="3.5" fill="#ff8a3c" opacity="0.5"/>
    <circle cx="28" cy="14" r="3.5" fill="#ff8a3c" opacity="0.5"/>
    <line x1="0" y1="24" x2="140" y2="24" stroke="#ff8a3c" stroke-width="1" opacity="0.3"/>
    <!-- YouTube tab icon -->
    <rect x="15" y="40" width="50" height="35" rx="4" fill="#ff8a3c" opacity="0.2"/>
    <polygon points="33,48 33,68 48,58" fill="#ff8a3c" opacity="0.5"/>
    <text x="70" y="125" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="18" fill="#ff8a3c" letter-spacing="0.08em">WORK</text>
  </g>

  <!-- Personal window (left) -->
  <g transform="translate(40,200)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="none" stroke="#24d4ff" stroke-width="2.5"/>
    <circle cx="16" cy="14" r="3.5" fill="#24d4ff" opacity="0.5"/>
    <circle cx="28" cy="14" r="3.5" fill="#24d4ff" opacity="0.5"/>
    <line x1="0" y1="24" x2="140" y2="24" stroke="#24d4ff" stroke-width="1" opacity="0.3"/>
    <!-- YouTube tab icon -->
    <rect x="15" y="40" width="50" height="35" rx="4" fill="#24d4ff" opacity="0.2"/>
    <polygon points="33,48 33,68 48,58" fill="#24d4ff" opacity="0.5"/>
    <text x="70" y="125" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="18" fill="#24d4ff" letter-spacing="0.08em">PERSONAL</text>
  </g>

  <!-- Infinity symbol in center -->
  <text x="250" y="260" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="48" fill="#ff3ba5" opacity="0.25">∞</text>

  <!-- Spinning tab in the loop (top) -->
  <g>
    <rect x="230" y="120" width="40" height="28" rx="5" fill="#ff3ba5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 250 250;360 250 250" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
