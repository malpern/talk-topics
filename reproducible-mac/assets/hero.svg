  <text x="118" y="258" font-size="16"><tspan fill="#28c840">  ✓ </tspan><tspan fill="#e9ece7">Done. </tspan><tspan fill="#88928b">Open a new terminal.</tspan></text>
  <text x="118" y="308" font-size="22"><tspan fill="#7dd3c0">❯ </tspan><tspan fill="#e9ece7" font-weight="700">there's no place like </tspan><tspan fill="#7dd3c0" font-weight="700">~/</tspan><tspan fill="#7dd3c0" font-size="22">█</tspan></text>
