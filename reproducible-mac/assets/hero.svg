  <circle cx="138" cy="73" r="6" fill="#febc2e"/>
  <circle cx="160" cy="73" r="6" fill="#28c840"/>
  <text x="500" y="78" text-anchor="middle" fill="#88928b" font-size="13">~/ — zsh</text>
  <!-- lines -->
  <text x="118" y="128" font-size="19"><tspan fill="#7dd3c0">❯ </tspan><tspan fill="#e9ece7">git clone </tspan><tspan fill="#88928b">github.com/malpern/dotfiles ~/dotfiles</tspan></text>
  <text x="118" y="162" font-size="19"><tspan fill="#7dd3c0">❯ </tspan><tspan fill="#e9ece7">cd ~/dotfiles &amp;&amp; </tspan><tspan fill="#e9ece7">./bootstrap.sh</tspan></text>
