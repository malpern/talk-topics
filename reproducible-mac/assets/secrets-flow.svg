<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, monospace">
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7dd3c0"/></marker>
  </defs>
  <rect width="880" height="440" rx="12" fill="#0a0d0c"/>

  <!-- secrets.env in git -->
  <rect x="40" y="44" width="320" height="118" rx="9" fill="#102019" stroke="#7dd3c0" stroke-width="2"/>
  <text x="60" y="74" fill="#7dd3c0" font-size="16" font-weight="700">secrets.env</text>
  <text x="60" y="94" fill="#88928b" font-size="12">committed to git · encrypted</text>
  <text x="60" y="122" fill="#e9ece7" font-size="12.5">ANTHROPIC_API_KEY=</text>
  <text x="60" y="140" fill="#3f8a7a" font-size="12.5">  ENC[AES256_GCM,data:+wTQ9u…]</text>
  <text x="372" y="58" fill="#88928b" font-size="11" transform="rotate(0)">in&nbsp;repo</text>

  <!-- age key, NOT in git -->
  <rect x="40" y="232" width="320" height="118" rx="9" fill="#141a17" stroke="#3f8a7a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="60" y="262" fill="#e9ece7" font-size="16" font-weight="700">🔑 age key</text>
  <text x="60" y="282" fill="#88928b" font-size="12">~/.config/sops/age/keys.txt</text>
  <text x="60" y="310" fill="#e9ece7" font-size="12.5">never committed · chmod 600</text>
  <text x="60" y="332" fill="#7dd3c0" font-size="12.5">backed up: Keychain · iCloud · paper</text>

  <!-- arrows converge to sops -->
  <path d="M360 103 L470 103 L470 196 L520 196" fill="none" stroke="#3f8a7a" stroke-width="1.5" marker-end="url(#ar2)"/>
  <path d="M360 291 L470 291 L470 200 L520 200" fill="none" stroke="#3f8a7a" stroke-width="1.5" marker-end="url(#ar2)"/>

  <!-- sops -d -->
  <rect x="524" y="160" width="150" height="76" rx="9" fill="#141a17" stroke="#3f8a7a" stroke-width="1.5"/>
  <text x="599" y="196" text-anchor="middle" fill="#7dd3c0" font-size="16" font-weight="700">sops -d</text>
  <text x="599" y="216" text-anchor="middle" fill="#88928b" font-size="11.5">decrypt</text>

  <line x1="674" y1="198" x2="722" y2="198" stroke="#3f8a7a" stroke-width="1.5" marker-end="url(#ar2)"/>

  <!-- env in shell -->
  <rect x="726" y="158" width="120" height="80" rx="9" fill="#102019" stroke="#7dd3c0" stroke-width="2"/>
  <text x="786" y="192" text-anchor="middle" fill="#7dd3c0" font-size="15" font-weight="700">$ENV</text>
  <text x="786" y="212" text-anchor="middle" fill="#88928b" font-size="11">at shell start</text>

  <text x="440" y="404" text-anchor="middle" fill="#88928b" font-size="13">reproducible by <tspan fill="#7dd3c0">git clone</tspan> — the key is the only thing you carry, and it works in cron/CI</text>
</svg>
